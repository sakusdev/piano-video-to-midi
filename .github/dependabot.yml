version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /wasm/piano-core
    schedule:
      interval: weekly
      day: monday
      time: "03:20"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "03:40"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
