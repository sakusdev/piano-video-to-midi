[package]
name = "piano-video-core"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM compute kernels for piano-video-to-midi"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
